[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  description = 'Brand systems, growth infrastructure, sovereign web operations. We build identities that convert, funnels that scale, infrastructure you own.'
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = false
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  disableSpecial1stPost = true
[params.assets]
  favicon = "/favicon.ico?v=2"
  favicon16x16 = "/favicon-16x16.png?v=2"
  favicon32x32 = "/favicon-32x32.png?v=2"
[params.label]
  text = "WHITESPACE DESIGN"
  icon = "/logo.png"
  iconHeight = 48

